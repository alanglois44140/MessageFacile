name: Construire MessageFacile (APK)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Vérifier le dossier du projet
        run: |
          pwd
          ls -la
          ls -la MessageFacile
          find MessageFacile -maxdepth 5 -type f
