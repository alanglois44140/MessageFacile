name: Construire MessageFacile (APK)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Préparer le SDK Android
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses

      - name: Installer les outils Android
        run: |
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Construire l’APK
        run: gradle --no-daemon assembleDebug

      - name: Publier l’APK
        uses: actions/upload-artifact@v4
        with:
          name: MessageFacile-APK
          path: app/build/outputs/apk/debug/app-debug.apk
